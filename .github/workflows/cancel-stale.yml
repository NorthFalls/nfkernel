name: Cancel stale tag builds

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel non-main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"
          for round in 1 2 3 4 5; do
            ids=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "$api" \
              | jq -r '.workflow_runs[] | select(.head_branch != "main" and .status != "completed") | .id')
            if [ -z "$ids" ]; then
              echo "no stale runs (round $round)"
              break
            fi
            for id in $ids; do
              echo "cancel $id"
              curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
            done
            sleep 10
          done
