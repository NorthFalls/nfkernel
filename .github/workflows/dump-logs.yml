name: dump-logs
on:
  push:
    paths:
      - '.github/workflows/dump-logs.yml'
permissions:
  actions: read
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=46032292477
          gh run view "$id" --log > build-log.txt || true
          git config user.name 'NorthFall'
          git config user.email '356526599+NorthFalls@users.noreply.github.com'
          git add build-log.txt
          git commit -m 'debug build log' || true
          git push
# trigger2
