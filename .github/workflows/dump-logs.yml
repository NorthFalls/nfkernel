name: dump-logs
on:
  push:
    paths:
      - '.github/workflows/dump-logs.yml'
permissions:
  actions: read
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dump last failed run log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          id=$(gh run list --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "failed run: $id"
          gh run view "$id" --log > build-log.txt || true
          wc -l build-log.txt
          git config user.name 'NorthFall'
          git config user.email '356526599+NorthFalls@users.noreply.github.com'
          git add build-log.txt
          git commit -m 'debug build log [skip ci]' || true
          git push
